# Menambahkan RabbitMQ ke Laravel Sail. File ini otomatis digabung dengan compose.yaml.
services:
  rabbitmq:
    image: 'rabbitmq:4-management'
    ports:
      - '${FORWARD_RABBITMQ_PORT:-5672}:5672'
      - '${FORWARD_RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: '${RABBITMQ_USER:-atk}'
      RABBITMQ_DEFAULT_PASS: '${RABBITMQ_PASSWORD:-atk}'
    volumes:
      - 'sail-rabbitmq:/var/lib/rabbitmq'
    networks:
      - sail
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      retries: 5
      timeout: 5s
volumes:
  sail-rabbitmq:
    driver: local
